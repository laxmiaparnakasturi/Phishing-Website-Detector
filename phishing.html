<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Phishing Website Detector</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col items-center justify-center p-6">
  <div class="bg-white shadow-lg rounded-2xl w-full max-w-2xl p-8">
    <h1 class="text-3xl font-bold text-center text-gray-800 mb-6">🔍 Phishing Website Detector</h1>
    
    <!-- Input Form -->
    <form id="urlForm" class="flex space-x-2 mb-6">
      <input type="url" id="urlInput" placeholder="Enter a website URL..." 
             class="flex-grow p-3 border rounded-lg focus:ring-2 focus:ring-blue-400 focus:outline-none" required>
      <button type="submit" 
              class="bg-blue-600 hover:bg-blue-700 text-white px-5 py-3 rounded-lg font-semibold">Check</button>
    </form>

    <!-- Result Display -->
    <div id="resultBox" class="hidden p-6 rounded-xl border transition-all duration-300"></div>
  </div>

  <script>
    // Rules with stronger weights
    const RULES = {
      longUrl: 8, 
      veryLongUrl: 15, 
      manySubdomains: 12, 
      hasAtSymbol: 20, 
      hasIpAsHost: 25,
      hasHyphenatedBrand: 15, 
      hasEncodedChars: 8, 
      hasPunycode: 20, 
      suspiciousSeparators: 10,
      excessiveParams: 12, 
      hasHashTrick: 8, 
      httpScheme: 20, 
      httpsButManyFlags: 8,
      uncommonTld: 12, 
      knownShortener: 20, 
      credentialWords: 15, 
      urgentWords: 12, 
      brandMismatch: 25,
      knownGoodTld: -5, 
      cleanSimplePath: -2
    };

    // Adjusted thresholds for better separation
    function riskLevel(score) {
      if (score >= 55) return { level: "High Risk 🚨", color: "bg-red-100 text-red-700", dot: "bg-red-600" };
      if (score >= 25) return { level: "Medium Risk ⚠️", color: "bg-amber-100 text-amber-700", dot: "bg-amber-600" };
      return { level: "Low Risk ✅", color: "bg-emerald-100 text-emerald-700", dot: "bg-emerald-600" };
    }

    // URL analysis function
    function analyzeUrl(url) {
      let score = 0;
      const parsed = new URL(url);

      // Features
      if (url.length > 75) score += RULES.longUrl;
      if (url.length > 120) score += RULES.veryLongUrl;

      if ((parsed.hostname.match(/\./g) || []).length > 3) score += RULES.manySubdomains;

      if (url.includes("@")) score += RULES.hasAtSymbol;

      if (/^(\d{1,3}\.){3}\d{1,3}$/.test(parsed.hostname)) score += RULES.hasIpAsHost;

      if (/-/.test(parsed.hostname)) score += RULES.hasHyphenatedBrand;

      if (/%[0-9A-Fa-f]{2}/.test(url)) score += RULES.hasEncodedChars;

      if (parsed.hostname.startsWith("xn--")) score += RULES.hasPunycode;

      if (/[_;]+/.test(url)) score += RULES.suspiciousSeparators;

      if ((url.match(/\?/g) || []).length > 2) score += RULES.excessiveParams;

      if (url.includes("#") && url.toLowerCase().includes("login")) score += RULES.hasHashTrick;

      if (parsed.protocol === "http:") score += RULES.httpScheme;

      if (parsed.protocol === "https:" && (url.includes("login") || url.includes("secure"))) score += RULES.httpsButManyFlags;

      if (/\.(xyz|top|club|info|tk)$/i.test(parsed.hostname)) score += RULES.uncommonTld;

      if (/(bit\.ly|tinyurl\.com|goo\.gl|t\.co)/i.test(parsed.hostname)) score += RULES.knownShortener;

      if (/(login|secure|account|verify|banking|confirm)/i.test(url)) score += RULES.credentialWords;

      if (/(update|urgent|verify-now|limited)/i.test(url)) score += RULES.urgentWords;

      // Example of brand mismatch (demo only)
      if (parsed.hostname.includes("paypal") && !parsed.hostname.endsWith("paypal.com")) {
        score += RULES.brandMismatch;
      }

      if (/\.(com|org|net|edu)$/i.test(parsed.hostname)) score += RULES.knownGoodTld;

      if (parsed.pathname === "/" || parsed.pathname.length < 5) score += RULES.cleanSimplePath;

      return score;
    }

    // Handle form submit
    document.getElementById("urlForm").addEventListener("submit", function(e) {
      e.preventDefault();
      const url = document.getElementById("urlInput").value.trim();
      let resultBox = document.getElementById("resultBox");

      try {
        const score = analyzeUrl(url);
        const risk = riskLevel(score);

        resultBox.innerHTML = `
          <div class="flex items-center space-x-3 mb-3">
            <div class="w-3 h-3 rounded-full ${risk.dot}"></div>
            <h2 class="text-xl font-bold">${risk.level}</h2>
          </div>
          <p class="mb-2">Risk Score: <span class="font-semibold">${score}</span></p>
          <p class="text-gray-700">Analyzed URL: <span class="font-mono">${url}</span></p>
        `;
        resultBox.className = `p-6 rounded-xl border ${risk.color} block`;
      } catch (err) {
        resultBox.innerHTML = `<p class="text-red-600">Invalid URL entered.</p>`;
        resultBox.className = `p-6 rounded-xl border bg-red-100 text-red-700 block`;
      }
    });
  </script>
</body>
</html>
